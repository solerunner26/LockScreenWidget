org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.parallel=true

# The app has zero AndroidX dependencies in its main source set (fully auditable),
# but the instrumented tests use androidx.test, so AndroidX must be enabled.
android.useAndroidX=true
android.nonTransitiveRClass=true
# Allow compiling against the Android 16 (API 36) platform even if the AGP version
# does not officially list it yet; the app runs forward-compatible on Android 17 beta.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
