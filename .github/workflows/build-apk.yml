name: Build & publish APK

# Builds a signed release APK of Quick Lock on every push to the working branch,
# runs the JVM unit tests, sanity-checks the APK's permission list, and uploads the
# APK as a workflow artifact. The APK is also attached to a GitHub Release by the
# agent after a successful run.

on:
  push:
    branches: [arena/8ef1f1ea-lockscreenwidget]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform 36 + build-tools)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          echo "Using SDK root: $SDK_ROOT"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "cmdline-tools missing; downloading..."
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          export PATH="$CMDLINE:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Generate throwaway signing keystore (never committed)
        run: |
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias quicklock -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Quick Lock, OU=Personal, O=QuickLock, C=IN"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=quicklock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        id: build
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      - name: Diagnose build failure (surfaces errors as run annotations)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=Gradle assembleRelease failed::see annotated error lines below"
          grep -E "e: |error:|FAILURE|What went wrong|Caused by|Execution failed|Execution failed for|> Task .* FAILED" /tmp/build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -40 /tmp/build.log
          exit 1

      - name: List build outputs (debug aid, emits annotations)
        if: always()
        run: |
          find app/build/outputs -type f 2>/dev/null | head -30 | while IFS= read -r l; do echo "::notice::output file: $l"; done
          find app/build -name "*.apk" 2>/dev/null | head -10 | while IFS= read -r l; do echo "::notice::apk found: $l"; done
          grep -E "What went wrong|Caused by|Execution failed|^e: |error: |FAILURE" /tmp/build.log 2>/dev/null | head -25 | while IFS= read -r l; do echo "::notice::build.log: $l"; done
          sed -n '/What went wrong/,/BUILD FAILED/p' /tmp/build.log 2>/dev/null | head -40 | while IFS= read -r l; do echo "::notice::WTR: $l"; done
          grep -E "^> Task" /tmp/build.log 2>/dev/null | grep -E "FAILED" | head -10 | while IFS= read -r l; do echo "::notice::task: $l"; done
          tail -15 /tmp/build.log 2>/dev/null | while IFS= read -r l; do echo "::notice::build.log tail: $l"; done

      - name: Sanity-check the APK (signature + permission allowlist)
        run: |
          set +e
          APK=$(find app/build -name "*.apk" -path "*release*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build -name "*.apk" 2>/dev/null | head -1); fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found anywhere under app/build"
            exit 1
          fi
          echo "APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -la "$APK"
          apksigner verify --print-certs "$APK" || echo "::warning::apksigner verify returned $?"
          BADGING=$(aapt2 dump badging "$APK" 2>/dev/null)
          echo "$BADGING" | grep -E "^(package|uses-permission|sdkVersion|targetSdkVersion)" | while IFS= read -r l; do echo "::notice::badging: $l"; done
          FAIL=0
          if ! echo "$BADGING" | grep -q "android.permission.VIBRATE"; then
            echo "::error::APK does not request VIBRATE (unexpected)"; FAIL=1
          fi
          if echo "$BADGING" | grep -qE "INTERNET|ACCESS_NETWORK_STATE|SYSTEM_ALERT_WINDOW|WAKE_LOCK|FOREGROUND_SERVICE|BOOT_COMPLETED|BIND_ACCESSIBILITY|READ_SMS|CAMERA|RECORD_AUDIO"; then
            echo "::error::SECURITY FAILURE: APK requests a forbidden permission"; FAIL=1
          fi
          echo "APK permission check finished, FAIL=$FAIL"
          exit $FAIL

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/**/*.apk

      - name: Publish build log to branch for debugging (on failure)
        if: failure()
        run: |
          mkdir -p ci-debug
          cp /tmp/build.log ci-debug/build.log 2>/dev/null || echo "no build log available"
          git config user.email "ci-debug@localhost"
          git config user.name "ci-debug"
          git add ci-debug/ 2>/dev/null
          git commit -m "ci-debug: gradle build log from failed run" 2>/dev/null || echo "nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:arena/8ef1f1ea-lockscreenwidget 2>&1 | tail -2 || true
