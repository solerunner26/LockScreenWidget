name: Build & publish APK

# Builds the Quick Lock APK on every push to the working branch:
#   - assembleDebug  (always works; auto-signed with the debug key — installable via adb)
#   - assembleRelease (signed with the PERMANENT release key from repo secrets, so
#     every build installs as an update over the previous one)
# Runs the JVM unit tests, sanity-checks every produced APK's permission list against
# a strict allowlist, uploads all APKs as a workflow artifact, and publishes a new
# versioned GitHub Release (v2.1.<run>) that Obtainium picks up as an update.

on:
  push:
    branches: [arena/8ef1f1ea-lockscreenwidget]
  workflow_dispatch:

permissions:
  contents: write   # for artifacts + best-effort release creation
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform 36 + build-tools)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          echo "Using SDK root: $SDK_ROOT"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "cmdline-tools missing; downloading..."
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          export PATH="$CMDLINE:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Restore permanent release signing key
        # The key lives only in repository secrets (RELEASE_KEYSTORE_B64 = base64 PKCS#12,
        # RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS). Same key every run -> updates
        # install over the existing app. Without the secrets (e.g. a fork) the build
        # falls back to a throwaway key and does NOT publish a release.
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "PERMANENT_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Release signing secrets missing - using a throwaway key; no release will be published"
            KS_PASS=$(openssl rand -hex 16); KS_ALIAS=quicklock
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Quick Lock throwaway"
            echo "PERMANENT_KEY=false" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$KS_PASS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Run JVM unit tests
        id: test
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log

      - name: Diagnose test failure (annotations)
        if: steps.test.outcome == 'failure'
        run: |
          grep -E "^e: |error: |FAILURE|What went wrong|Caused by|Execution failed" /tmp/test.log 2>/dev/null | head -30 | while IFS= read -r l; do echo "::error::TEST: $l"; done
          exit 1

      - name: Build APKs (debug always; release signed in CI)
        id: build
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build-debug.log
          echo "assembleDebug exit code: $?"
          ./gradlew --stop > /dev/null 2>&1   # fresh daemon for the heavier release compile
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
          echo "assembleRelease exit code: $?"
          echo "--- APKs produced ---"
          find app/build/outputs/apk -type f 2>/dev/null || echo "none"
          exit 0

      - name: Dump gradle failure section (annotations, for debugging)
        if: always()
        run: |
          grep -E "^e: |error: |OutOfMemory|Killed process" /tmp/build.log 2>/dev/null | head -25 | while IFS= read -r l; do echo "::error::E: $l"; done
          sed -n '/What went wrong/,$p' /tmp/build.log 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::REL: $l"; done
          grep -E "^e: |error: " /tmp/test.log 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::TESTLOG: $l"; done
          echo "--- debug log tail ---"
          tail -5 /tmp/build-debug.log 2>/dev/null

      - name: Sanity-check every APK (permission allowlist)
        run: |
          set +e
          APKS=$(find app/build -name "*.apk" 2>/dev/null)
          if [ -z "$APKS" ]; then
            echo "::error::No APK produced at all"
            exit 1
          fi
          FAIL=0
          for APK in $APKS; do
            echo "checking $APK"
            ls -la "$APK"
            apksigner verify "$APK" || echo "::warning::apksigner verify failed for $APK"
            BADGING=$(aapt2 dump badging "$APK" 2>/dev/null)
            echo "$BADGING" | grep -E "^(package|uses-permission|sdkVersion|targetSdkVersion)" || true
            if ! echo "$BADGING" | grep -q "android.permission.VIBRATE"; then
              echo "::error::$APK does not request VIBRATE"; FAIL=1
            fi
            if echo "$BADGING" | grep "^uses-permission" | grep -qE "INTERNET|ACCESS_NETWORK_STATE|SYSTEM_ALERT_WINDOW|WAKE_LOCK|FOREGROUND_SERVICE|BOOT_COMPLETED|BIND_ACCESSIBILITY|READ_SMS|CAMERA|RECORD_AUDIO|READ_CONTACTS|REQUEST_INSTALL_PACKAGES"; then
              echo "::error::SECURITY FAILURE: $APK requests a forbidden permission"; FAIL=1
            fi
            # The device-admin receiver must survive minification/shrinking and stay
            # registered in the binary manifest, otherwise admin activation breaks.
            MTREE=$(aapt2 dump xmltree "$APK" --file AndroidManifest.xml 2>/dev/null)
            if ! echo "$MTREE" | grep -q "LockDeviceAdminReceiver"; then
              echo "::error::$APK: manifest is missing LockDeviceAdminReceiver"; FAIL=1
            fi
            if ! echo "$MTREE" | grep -q "android.app.device_admin"; then
              echo "::error::$APK: manifest is missing android.app.device_admin meta-data"; FAIL=1
            fi
            # Without this intent-filter Settings hides the app from "Device admin
            # apps" and the activation dialog silently refuses it.
            if ! echo "$MTREE" | grep -q "android.app.action.DEVICE_ADMIN_ENABLED"; then
              echo "::error::$APK: admin receiver is missing the DEVICE_ADMIN_ENABLED intent-filter"; FAIL=1
            fi
            # (resource file paths are shortened in release APKs, so check the
            # resource TABLE, not the zip entry names)
            if ! aapt2 dump resources "$APK" 2>/dev/null | grep -q "device_admin_policies"; then
              echo "::error::$APK: device_admin_policies resource missing from resources.arsc"; FAIL=1
            fi
          done
          echo "permission allowlist check finished, FAIL=$FAIL"
          exit $FAIL

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quicklock-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90

      - name: Publish versioned GitHub Release (Obtainium update feed)
        if: success() && env.PERMANENT_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK"; exit 1; }
          VER=$(aapt2 dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          [ -n "$VER" ] || { echo "::error::could not read versionName"; exit 1; }
          OUT="QuickLock-$VER.apk"
          cp "$APK" "$OUT"
          {
            echo "## What's new"
            git log -1 --pretty=%B | grep -v '^Co-Authored-By:'
            echo
            echo "Built from \`${GITHUB_SHA}\`. Installs as an update over any earlier 2.1.x build."
            echo "Easiest: add github.com/${GITHUB_REPOSITORY} to Obtainium and tap Update."
          } > notes.md
          # Only the release APK is attached, so Obtainium never has to choose.
          gh release create "v$VER" "$OUT" --target "$GITHUB_SHA" \
            --title "Quick Lock $VER" --notes-file notes.md --latest
          echo "published v$VER"
