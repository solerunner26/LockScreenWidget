name: Build & publish APK

# Builds the Quick Lock APK on every push to the working branch:
#   - assembleDebug  (always works; auto-signed with the debug key — installable via adb)
#   - assembleRelease (signed in CI with a throwaway per-run keystore)
# Runs the JVM unit tests, sanity-checks every produced APK's permission list against
# a strict allowlist, uploads all APKs as a workflow artifact, and (best effort)
# attaches them to a GitHub Release.

on:
  push:
    branches: [arena/8ef1f1ea-lockscreenwidget]
  workflow_dispatch:

permissions:
  contents: write   # for artifacts + best-effort release creation
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform 36 + build-tools)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          echo "Using SDK root: $SDK_ROOT"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "cmdline-tools missing; downloading..."
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          export PATH="$CMDLINE:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Generate throwaway signing keystore (never committed)
        run: |
          # PKCS#12 keystores use a single password for store and key, so use one.
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -storetype PKCS12 \
            -alias quicklock -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Quick Lock, OU=Personal, O=QuickLock, C=IN"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=quicklock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APKs (debug always; release signed in CI)
        id: build
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build-debug.log
          echo "assembleDebug exit code: $?"
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
          echo "assembleRelease exit code: $?"
          echo "--- APKs produced ---"
          find app/build/outputs/apk -type f 2>/dev/null || echo "none"
          exit 0

      - name: Dump gradle failure section (annotations, for debugging)
        if: always()
        run: |
          sed -n '/What went wrong/,$p' /tmp/build.log 2>/dev/null | head -35 | while IFS= read -r l; do echo "::error::REL: $l"; done
          echo "--- debug log tail ---"
          tail -5 /tmp/build-debug.log 2>/dev/null

      - name: Sanity-check every APK (permission allowlist)
        run: |
          set +e
          APKS=$(find app/build -name "*.apk" 2>/dev/null)
          if [ -z "$APKS" ]; then
            echo "::error::No APK produced at all"
            exit 1
          fi
          FAIL=0
          for APK in $APKS; do
            echo "checking $APK"
            ls -la "$APK"
            apksigner verify "$APK" || echo "::warning::apksigner verify failed for $APK"
            BADGING=$(aapt2 dump badging "$APK" 2>/dev/null)
            echo "$BADGING" | grep -E "^(package|uses-permission|sdkVersion|targetSdkVersion)" || true
            if ! echo "$BADGING" | grep -q "android.permission.VIBRATE"; then
              echo "::error::$APK does not request VIBRATE"; FAIL=1
            fi
            if echo "$BADGING" | grep -qE "INTERNET|ACCESS_NETWORK_STATE|SYSTEM_ALERT_WINDOW|WAKE_LOCK|FOREGROUND_SERVICE|BOOT_COMPLETED|BIND_ACCESSIBILITY|READ_SMS|CAMERA|RECORD_AUDIO|READ_CONTACTS"; then
              echo "::error::SECURITY FAILURE: $APK requests a forbidden permission"; FAIL=1
            fi
            # The device-admin receiver must survive minification/shrinking and stay
            # registered in the binary manifest, otherwise admin activation breaks.
            MTREE=$(aapt2 dump xmltree "$APK" --file AndroidManifest.xml 2>/dev/null)
            if ! echo "$MTREE" | grep -q "LockDeviceAdminReceiver"; then
              echo "::error::$APK: manifest is missing LockDeviceAdminReceiver"; FAIL=1
            fi
            if ! echo "$MTREE" | grep -q "android.app.admin.device_admin"; then
              echo "::error::$APK: manifest is missing android.app.admin.device_admin meta-data"; FAIL=1
            fi
            if ! unzip -l "$APK" | grep -q "device_admin_policies"; then
              echo "::error::$APK: device_admin_policies.xml was stripped from resources"; FAIL=1
            fi
          done
          echo "permission allowlist check finished, FAIL=$FAIL"
          exit $FAIL

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quicklock-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90

      - name: Create/update GitHub Release with the APK (best effort)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*.apk" | head -1); fi
          echo "release asset: $APK"
          gh release create v1.0.0 --target "${GITHUB_REF_NAME}" \
            --title "Quick Lock v1.0.0" \
            --notes "APK built by CI from \`${GITHUB_SHA}\`. Install with \`adb install $APK\` or download on your phone and open it (allow 'install unknown apps' for your browser/file manager)." \
            "$APK" 2>&1 | tail -2
          # subsequent runs: tag exists -> just (re)upload all APKs
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            gh release upload v1.0.0 "$f" --clobber 2>&1 | tail -1
          done
          gh release view v1.0.0 --json assets --jq '.assets[].name' || true
